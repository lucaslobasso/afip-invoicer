<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Croessant</title>

    <link rel="stylesheet" href="../../node_modules/@fontsource/lato/400.css">
    <link rel="stylesheet" href="../../node_modules/@fontsource/lato/700.css">
    <link rel="stylesheet" href="../../node_modules/animate.css/animate.min.css">
    <link rel="stylesheet" href="../../node_modules/vanillajs-datepicker/dist/css/datepicker.min.css">
    <link rel="stylesheet" href="../css/main.css">

    <script src="../../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../../node_modules/@fortawesome/fontawesome-free/js/all.min.js"></script>
    <script src="../../node_modules/bulma-toast/dist/bulma-toast.min.js"></script>
    <script src="../../node_modules/vanillajs-datepicker/dist/js/datepicker-full.min.js"></script>
    <script src="../../node_modules/vanillajs-datepicker/dist/js/locales/es.js"></script>

    <script defer src="../js/main.js"></script>
    <script defer src="../js/invoices_list.js"></script>
  </head>
  <body class="is-flex is-flex-direction-column">
    <section id="app-header" class="hero is-primary">
      <div class="hero-head">
        <nav class="navbar">
          <div class="navbar-brand">
            <div class="navbar-item">
              <img src="../../assets/icon.png" alt="Logo">
              <span>Croessant</span>
            </div>
          </div>
          <div class="navbar-menu">
            <div class="navbar-end">
              <div class="navbar-item">
                <div class="buttons are-small">
                  <button class="button is-primary is-rounded has-tooltip-primary has-tooltip-left" data-action="reconnect" data-tooltip="Reconectar" type="button">
                    <i class="fas fa-sync"></i>
                  </button>
                  <button class="button is-primary is-rounded has-tooltip-primary has-tooltip-left" data-view="generate_invoice.html" data-tooltip="Generación de comprobantes" type="button">
                    <i class="fas fa-file-invoice-dollar"></i>
                  </button>
                  <button class="button is-light is-rounded has-tooltip-primary has-tooltip-left" data-view="configurate.html" data-tooltip="Configuración" type="button">
                    <i class="fas fa-cog"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </nav>
      </div>
      <div class="hero-body">
        <p class="title has-text-centered">Consulta de comprobantes</p>
      </div>
    </section>
    <section id="app-body" class="section is-flex is-flex-direction-column is-flex-grow-1 contains-list">
        <fieldset id="filter-fields">
          <div class="field">
            <label class="label">Fecha</label>
            <div id="range" class="field has-addons">
              <div class="control is-expanded">
                <input name="start" class="input datepicker-input" type="text" autocomplete="off">
              </div>
              <div class="control">
                <a class="button is-static">a</a>
              </div>
              <div class="control is-expanded">
                <input name="end" class="input datepicker-input" type="text" autocomplete="off">
              </div>
            </div>
          </div>
          <div class="field is-grouped">
            <div class="field is-expanded">
              <label class="label" for="pointOfSale">Punto de venta</label>
              <div class="select">
                <select id="pointOfSale"></select>
              </div>
            </div>
            <div class="field is-flex is-align-items-flex-end">
              <button id="searchInvoices" class="button is-info is-fullwidth" data-tooltip="Buscar" type="button">
                <i class="fas fa-search"></i>
              </button>
            </div>
          </div>
        </fieldset>
        <div id="invoices-list-container" class="is-flex-grow-1">
          <ul id="invoices-list">
            <li id="invoice-list-item-template" class="invoice-list-item is-hidden">
              <div class="tile is-child notification is-flex">
                <span class="invoice-number"></span>
                <span class="invoice-body is-flex is-flex-direction-column">
                  <span class="invoice-date is-flex is-align-items-center"></span>
                  <span class="invoice-concept is-flex is-align-items-center"></span>
                </span>
                <span class="invoice-amount"></span>
              </div>
            </li>
            <li id="invoice-list-no-items" class="invoice-list-item is-hidden">
              <div class="tile is-child notification is-warning is-light">
                No se encontraron comprobantes.
              </div>
            </li>
          </ul>
          <div id="invoices-loader" class="pageloader inline-loader is-bottom-to-top"><span class="title">Buscando...</span></div>
        </div>
        <div id="invoices-total" class="is-flex is-justify-content-space-between is-hidden">
          <span>Total:</span>
          <span class="total-amount"></span>
        </div>
    </section>
    <div id="page-loader" class="pageloader is-bottom-to-top is-active"><span class="title">Conectando con ARCA...</span></div>
    <footer id="app-footer" class="footer">
      <div class="content has-text-centered">
        <p><strong>Croessant</strong> hecho por Lucas Lobasso.</p>
        <p>Código open-source disponible en <a href="https://github.com/lucaslobasso/afip-invoicer" target="_blank" rel="noopener">Github</a>.</p>
      </div>
    </footer>
  </body>
</html>
